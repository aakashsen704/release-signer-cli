[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "release-signer"
version = "1.0.0"
description = "CLI for signing and verifying software release artifacts with RSA digital signatures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42.0.0",
]

[project.scripts]
release-signer = "release_signer.cli:main"

[tool.setuptools.packages.find]
include = ["release_signer*"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
